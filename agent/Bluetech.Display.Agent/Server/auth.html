<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abbinamento</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #0b1017; --card: #141b26; --line: rgba(255,255,255,.09); --text: #e6eaf2; --muted: #9aa6ba; --faint: #6f7e95; --ok: #3ddc97; --warn: #f5b84a; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 18px/1.5 system-ui, "Segoe UI", sans-serif; text-align: center; padding: 24px 16px 64px; -webkit-user-select: none; user-select: none; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: clamp(24px, 5vw, 48px) clamp(20px, 6vw, 64px); max-width: 640px; width: 100%; }
  h1 { font-size: clamp(20px, 3.2vw, 28px); font-weight: 600; margin: 0 0 8px; }
  .label { color: var(--muted); margin: 0; }
  #code { font: 700 clamp(56px, 14vw, 120px)/1.1 ui-monospace, Consolas, "Segoe UI", monospace; letter-spacing: .08em; margin: 18px 0 14px; font-variant-numeric: tabular-nums; }
  #code.wait { color: var(--faint); }
  .how { color: var(--muted); margin: 0 auto 18px; max-width: 30em; }
  .how b { color: var(--text); font-weight: 600; }
  #status { font-weight: 600; min-height: 1.5em; margin: 0; }
  #status.ok { color: var(--ok); }
  #status.err { color: var(--warn); }
  #expires { color: var(--faint); font-size: 14px; margin: 6px 0 0; min-height: 1.5em; }
  footer { position: fixed; bottom: 16px; left: 0; right: 0; color: var(--faint); font-size: 13px; }
</style>
</head>
<body>
<main class="card">
  <h1>Abbinamento di questo schermo</h1>
  <p class="label">Codice di abbinamento</p>
  <div id="code" class="wait" aria-live="polite">······</div>
  <p class="how">Nel <b>back office</b> dell'Agent apri <b>Dispositivi</b>, scrivi questo codice e scegli la cassa da mostrare.</p>
  <p id="status">In attesa dell'autorizzazione…</p>
  <p id="expires"></p>
</main>
<footer>powered by Bluetech</footer>
<script>
"use strict";
const codeBox = document.getElementById("code");
const statusBox = document.getElementById("status");
const expiresBox = document.getElementById("expires");
let expiresAt = 0;
let pollTimer = 0;

function show(text, kind) {
  statusBox.textContent = text;
  statusBox.className = kind || "";
}

function done() {
  clearTimeout(pollTimer);
  show("Autorizzato: apro lo schermo del cliente…", "ok");
  setTimeout(() => location.replace("/cliente"), 600);
}

async function start() {
  clearTimeout(pollTimer);
  try {
    const response = await fetch("/api/abbinamento", { method: "POST", cache: "no-store" });
    const answer = await response.json();
    if (answer.stato === "autorizzato") return done();
    codeBox.textContent = answer.codice.slice(0, 3) + " " + answer.codice.slice(3);
    codeBox.className = "";
    expiresAt = Date.now() + answer.scadeTraSecondi * 1000;
    show("In attesa dell'autorizzazione…");
    pollTimer = setTimeout(poll, 2000);
  } catch {
    codeBox.className = "wait";
    show("L'Agent non risponde: riprovo…", "err");
    pollTimer = setTimeout(start, 5000);
  }
}

async function poll() {
  try {
    const response = await fetch("/api/abbinamento", { cache: "no-store" });
    const answer = await response.json();
    if (answer.stato === "autorizzato") return done();
    if (answer.stato !== "attesa") return start();   // scaduto: un codice nuovo
    show("In attesa dell'autorizzazione…");
  } catch {
    show("L'Agent non risponde: riprovo…", "err");
  }
  pollTimer = setTimeout(poll, 2000);
}

setInterval(() => {
  if (!expiresAt) return;
  const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
  expiresBox.textContent = left > 0 ? "Il codice vale ancora " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") : "";
  if (left === 0) { expiresAt = 0; start(); }
}, 1000);

start();
</script>
</body>
</html>
