<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Abbinamento</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
  :root { color-scheme: dark; --bg: #0B1017; --surface: #141B26; --line: rgba(255,255,255,.1); --text: #E6EAF2; --muted: #9AA6BA; --faint: #7B8596; --primary: #1F6FEB; --glow: #1F6FEB; --font-display: 'Archivo', 'Arial Narrow', sans-serif; --font-text: 'IBM Plex Sans', 'Segoe UI', sans-serif; }
  /*TEMA*/
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; background: var(--bg); color: var(--text); font: 18px/1.5 var(--font-text); text-align: center; padding: 24px 16px 72px; -webkit-user-select: none; user-select: none; overflow: hidden; }
  /* Una luce del primario dietro il codice: la stessa scena del monitor, ferma. */
  body::before { content: ""; position: fixed; inset: -20% -10% auto; height: 80%; background: radial-gradient(closest-side, color-mix(in srgb, var(--glow) 32%, transparent), transparent); opacity: .7; pointer-events: none; }
  main { position: relative; display: flex; flex-direction: column; align-items: center; gap: 0; max-width: 760px; width: 100%; }
  .brand { display: flex; align-items: center; gap: 12px; font: 600 clamp(20px, 3vw, 26px)/1 var(--font-display); letter-spacing: .06em; text-transform: uppercase; min-height: 1em; }
  .brand svg { width: 30px; height: 30px; color: var(--text); flex: none; }
  .label { color: var(--muted); font-size: 14px; letter-spacing: .22em; text-transform: uppercase; margin: 22px 0 14px; }
  #code { display: flex; gap: clamp(8px, 1.6vw, 14px); justify-content: center; }
  #code span { display: grid; place-items: center; width: clamp(46px, 11vw, 92px); height: clamp(58px, 13vw, 112px); border-radius: 12px;
               background: color-mix(in srgb, var(--surface) 88%, transparent); border: 1px solid var(--line);
               font: 700 clamp(34px, 8vw, 72px)/1 var(--font-display); font-variant-numeric: tabular-nums; }
  #code.wait span { color: var(--faint); }
  .how { color: var(--muted); margin: 22px auto 0; max-width: 28em; }
  .how b { color: var(--text); font-weight: 600; }
  #status { min-height: 1.5em; margin: 10px 0 0; color: var(--faint); font-size: 15px; }
  #status.ok { color: var(--text); font-weight: 600; }
  footer { position: fixed; bottom: 18px; right: 22px; display: flex; align-items: center; gap: 8px; color: var(--faint); font-size: 12px; }
  footer svg { width: 16px; height: 16px; }
  footer b { font: 600 12px var(--font-display); letter-spacing: .16em; color: var(--text); }
  @media (max-aspect-ratio: 1/1) { footer { left: 0; right: 0; justify-content: center; } }
  @media (prefers-reduced-motion: no-preference) { #code span { transition: opacity .3s; } #code.wait span { opacity: .55; } }
</style>
</head>
<body>
<main>
  <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="10.2"/><path d="M12 6.8 17 15.6H7Z"/></svg><span>{{locale}}</span></div>
  <p class="label">Codice di abbinamento</p>
  <div id="code" class="wait" aria-live="polite"><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span><span>·</span></div>
  <p class="how">Scrivilo nel <b>back office</b>, alla voce <b>Schermi</b>. Scade fra <b id="minutes">8 minuti</b>, poi se ne genera un altro.</p>
  <p id="status" role="status"></p>
</main>
<footer aria-label="powered by Bluetech">powered by
  <svg viewBox="0 0 34 34" aria-hidden="true"><rect x="1" y="1" width="32" height="32" rx="9" fill="none" stroke="var(--primary)" stroke-width="2.6"/><path d="M11 24V10h6.5a4 4 0 0 1 0 8H11m0 0h7.5a4 4 0 0 1 0 6H11" fill="none" stroke="var(--text)" stroke-width="3" stroke-linecap="round"/></svg>
  <b>BLUETECH</b></footer>
<script>
"use strict";
// Il codice è grande perché il tecnico lo legge dall'altra parte del banco; alla scadenza se ne genera un altro da sé,
// senza che nessuno debba ricaricare la pagina (SPEC §21).
const codeBox = document.getElementById("code");
const statusBox = document.getElementById("status");
const minutesBox = document.getElementById("minutes");
let expiresAt = 0;
let pollTimer = 0;

function show(text, kind) {
  statusBox.textContent = text;
  statusBox.className = kind || "";
}

function digits(code) {
  [...codeBox.children].forEach((box, i) => { box.textContent = code ? code[i] : "·"; });
  codeBox.className = code ? "" : "wait";
}

function done() {
  clearTimeout(pollTimer);
  show("Abbinato: apro lo schermo…", "ok");
  setTimeout(() => location.replace("/cliente"), 600);
}

async function start() {
  clearTimeout(pollTimer);
  try {
    const response = await fetch("/api/abbinamento", { method: "POST", cache: "no-store" });
    const answer = await response.json();
    if (answer.stato === "autorizzato") return done();
    digits(answer.codice);
    expiresAt = Date.now() + answer.scadeTraSecondi * 1000;
    show("");
    pollTimer = setTimeout(poll, 2000);
  } catch {
    digits("");
    show("Mi ricollego all'Agent…");
    pollTimer = setTimeout(start, 5000);
  }
}

async function poll() {
  try {
    const response = await fetch("/api/abbinamento", { cache: "no-store" });
    const answer = await response.json();
    if (answer.stato === "autorizzato") return done();
    if (answer.stato !== "attesa") return start();   // scaduto: un codice nuovo
    show("");
  } catch {
    show("Mi ricollego all'Agent…");
  }
  pollTimer = setTimeout(poll, 2000);
}

setInterval(() => {
  if (!expiresAt) return;
  const left = Math.max(0, Math.round((expiresAt - Date.now()) / 1000));
  const minutes = Math.ceil(left / 60);
  minutesBox.textContent = left > 60 ? minutes + " minuti" : left > 0 ? left + " secondi" : "un attimo";
  if (left === 0) { expiresAt = 0; start(); }
}, 1000);

start();
</script>
</body>
</html>
