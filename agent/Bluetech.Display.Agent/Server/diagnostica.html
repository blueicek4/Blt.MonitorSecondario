<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnostica Agent</title>
<link rel="icon" href="data:,">
<style>
  :root { color-scheme: dark; --bg: #0b1017; --card: #141b26; --line: rgba(255,255,255,.09); --text: #e6eaf2; --muted: #9aa6ba; --faint: #6f7e95; --ok: #3ddc97; --warn: #f5b84a; --accent: #3ddc97; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 8px 24px; align-items: baseline; padding: 16px 24px; border-bottom: 1px solid var(--line); }
  h1 { font-size: 18px; margin: 0 16px 0 0; }
  .fact { color: var(--muted); } .fact b { color: var(--text); font-weight: 600; }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--warn); margin-right: 6px; }
  .dot.on { background: var(--ok); }
  main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; padding: 24px; }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; padding: 16px; } header { padding: 16px; } }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 20px; min-width: 0; }
  h2 { font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 12px; }
  ul { list-style: none; margin: 0; padding: 0; }
  .row { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .row .desc { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  .row .qty { color: var(--muted); }
  .row .amount { font-variant-numeric: tabular-nums; white-space: nowrap; }
  .row.discount, .row.surcharge { color: var(--accent); }
  .row.void { color: var(--faint); text-decoration: line-through; }
  .row.note { color: var(--muted); font-style: italic; padding-left: 28px; }
  .total { display: flex; justify-content: space-between; align-items: baseline; margin-top: 16px; font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .empty { color: var(--faint); }
  #paid { margin: 12px 0 0; color: var(--ok); font-weight: 600; display: none; }
  #qr { margin-top: 16px; display: none; }
  #qr img { image-rendering: pixelated; width: 240px; height: 240px; background: #fff; padding: 16px; border-radius: 12px; }
  #log li { font: 12px/1.5 ui-monospace, Consolas, monospace; color: var(--muted); padding: 4px 0; border-bottom: 1px solid var(--line); overflow-wrap: anywhere; }
  #log li b { color: var(--text); font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>Bluetech Display Agent · diagnostica</h1>
  <span class="fact"><span id="dot" class="dot"></span><b id="link">collegamento…</b></span>
  <span class="fact">Fase <b id="phase">-</b></span>
  <span class="fact">Cassa sul <b id="bill">-</b></span>
  <span class="fact">Ultimo battito <b id="beat">-</b></span>
  <span class="fact"><a href="/api/stato" style="color:var(--muted)">stato in JSON</a></span>
</header>
<main>
  <section aria-label="Conto">
    <h2>Il conto, come lo vedrà il cliente</h2>
    <ul id="lines"></ul>
    <p id="nolines" class="empty">Nessun conto in corso: il display mostra le slide.</p>
    <div class="total"><span>Totale</span><span id="total">€ 0,00</span></div>
    <p id="paid"></p>
    <div id="qr"><h2 id="qrtitle">QR di pagamento</h2><p id="qrcaption" class="empty"></p><img id="qrimg" alt="QR"></div>
  </section>
  <section aria-label="Messaggi">
    <h2>Ultimi messaggi dalla cassa</h2>
    <ul id="log"></ul>
  </section>
</main>
<script>
"use strict";
const euro = new Intl.NumberFormat("it-IT", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const money = (cents) => (cents < 0 ? "−" : "") + "€ " + euro.format(Math.abs(cents) / 100);
const state = { phase: "idle", lines: [], total: 0, payment: null, paid: null, bill: false, receiptQr: null };
const voidedAt = new Map();
// Come il display: dopo PAGATO, Grazie con le righe per 8 s (30 s con il QR dello scontrino digitale), poi l'attesa
// (le slide) senza il conto vecchio.
const THANKS_MS = 8000;
const THANKS_WITH_QR_MS = 30000;
let thanksTimer = 0;

function clear(phase) {
  clearTimeout(thanksTimer);
  state.phase = phase; state.lines = []; state.total = 0; state.payment = null; state.paid = null;
  state.bill = false; state.receiptQr = null;
}

function thanksFor(ms) {
  clearTimeout(thanksTimer);
  thanksTimer = setTimeout(() => { clear("idle"); render(); }, ms);
}

function apply(m) {
  switch (m.t) {
    case "sync":
      clearTimeout(thanksTimer);
      state.paid = null;
      state.phase = m.state.phase || "idle";
      state.lines = (m.state.lines || []).slice();
      state.total = m.state.total || 0;
      state.payment = m.state.payment || null;
      state.bill = !!m.state.bill;
      state.receiptQr = null;
      break;
    case "sale.open":
      clear("sale");
      break;
    case "sale.line": {
      if (state.phase === "thanks") clear("sale");
      const i = state.lines.findIndex((l) => l.id === m.line.id);
      if (i >= 0) state.lines[i] = m.line; else state.lines.push(m.line);
      if (m.line.kind === "void") voidedAt.set(m.line.id, Date.now());
      if (state.phase === "idle") state.phase = "sale";
      break;
    }
    case "sale.total": state.total = m.total; state.bill = !!m.bill; break;
    case "sale.close":
      if (!m.paid) { clear("idle"); break; }
      state.phase = "thanks"; state.payment = null; state.paid = m.paid;
      thanksFor(state.receiptQr ? THANKS_WITH_QR_MS : THANKS_MS);
      break;
    case "pay.qr": state.phase = "payment"; state.payment = { png: m.png, amount: m.amount, caption: m.caption }; break;
    case "receipt.qr":
      state.receiptQr = { png: m.png, caption: m.caption };
      state.payment = null;
      if (state.phase !== "sale") { state.phase = "thanks"; thanksFor(THANKS_WITH_QR_MS); }
      break;
    case "pay.clear":
      state.payment = null;
      if (state.phase === "payment") state.phase = state.lines.length ? "sale" : "idle";   // QR senza conto: l'attesa
      break;
  }
}

function render() {
  const voided = new Set(state.lines.filter((l) => l.kind === "void" && l.voidsId).map((l) => l.voidsId));
  const list = document.getElementById("lines");
  list.replaceChildren();
  for (const line of state.lines) {
    if (voided.has(line.id)) continue;
    if (line.kind === "void" && Date.now() - (voidedAt.get(line.id) || 0) > 6000) continue;
    const li = document.createElement("li");
    li.className = "row " + line.kind;
    const desc = document.createElement("span");
    desc.className = "desc";
    desc.textContent = line.kind === "note" ? line.text : line.desc;
    li.append(desc);
    if (line.kind === "item" && line.qty !== 1) {
      const qty = document.createElement("span");
      qty.className = "qty";
      qty.textContent = "×" + String(line.qty).replace(".", ",");
      li.append(qty);
    }
    if (line.kind !== "note") {
      const amount = document.createElement("span");
      amount.className = "amount";
      amount.textContent = (line.kind === "surcharge" ? "+" : "") + money(line.amount);
      li.append(amount);
    }
    list.append(li);
  }
  document.getElementById("nolines").style.display = list.children.length ? "none" : "";
  document.getElementById("total").textContent = money(state.total);
  document.getElementById("phase").textContent = state.phase;
  const paid = document.getElementById("paid");
  paid.style.display = state.paid ? "block" : "none";
  if (state.paid) {
    paid.textContent = "Grazie · pagato " + state.paid.method + " " + money(state.paid.amount)
      + (state.paid.change > 0 ? " · resto " + money(state.paid.change) : "");
  }
  document.getElementById("bill").textContent = state.phase === "idle" ? "-" : state.bill ? "conto" : "battuta";
  const shown = state.payment || state.receiptQr;
  const qr = document.getElementById("qr");
  qr.style.display = shown ? "block" : "none";
  if (shown) {
    document.getElementById("qrtitle").textContent = state.payment ? "QR di pagamento" : "Scontrino digitale";
    document.getElementById("qrcaption").textContent = shown.caption || "";
    if (typeof shown.png === "string" && shown.png.startsWith("data:image/")) document.getElementById("qrimg").src = shown.png;
  }
}

function log(m) {
  const shown = JSON.parse(JSON.stringify(m));
  if (shown.png) shown.png = "(immagine)";
  if (shown.state && shown.state.payment) shown.state.payment.png = "(immagine)";
  const li = document.createElement("li");
  const kind = document.createElement("b");
  kind.textContent = new Date().toLocaleTimeString("it-IT") + "  " + m.t;
  li.append(kind, document.createTextNode("  " + JSON.stringify(shown)));
  const box = document.getElementById("log");
  box.prepend(li);
  while (box.children.length > 60) box.lastChild.remove();
}

let delay = 1000;
function connect() {
  const socket = new WebSocket((location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws");
  socket.onopen = () => {
    delay = 1000;
    document.getElementById("link").textContent = "collegato";
    document.getElementById("dot").classList.add("on");
  };
  socket.onmessage = (event) => {
    let message;
    try { message = JSON.parse(event.data); } catch { return; }
    if (message.t === "hb") {
      document.getElementById("beat").textContent = new Date().toLocaleTimeString("it-IT");
      return;
    }
    apply(message);
    log(message);
    render();
  };
  socket.onclose = () => {
    document.getElementById("link").textContent = "riconnessione…";
    document.getElementById("dot").classList.remove("on");
    setTimeout(connect, delay);
    delay = Math.min(delay * 2, 8000);
  };
}
setInterval(render, 1000);
connect();
</script>
</body>
</html>
