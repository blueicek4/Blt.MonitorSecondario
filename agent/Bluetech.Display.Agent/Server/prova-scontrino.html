<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Scontrino di prova</title>
<style>
  :root { color-scheme: light; --bg: #f4f6fa; --card: #fff; --text: #10151d; --muted: #5a6679; --primary: #1757c2; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: 24px 16px 40px; }
  .badge { display: inline-block; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--primary); background: rgba(23,87,194,.08); border-radius: 999px; padding: 4px 10px; }
  h1 { font-size: 22px; margin: 12px 0 4px; }
  p { color: var(--muted); margin: 0 0 18px; }
  pre { background: var(--card); border-radius: 12px; box-shadow: 0 2px 24px rgba(16,21,29,.06); padding: 18px 14px; margin: 0; overflow-x: auto;
        font: 13px/1.5 ui-monospace, "Cascadia Mono", Consolas, monospace; white-space: pre; }
  footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <span class="badge">Modalità demo</span>
  <h1>Scontrino di prova</h1>
  <p>Questo QR è finto: lo crea il monitor del cliente in modalità demo, per provare lo scontrino digitale e la copia di carta. Il documento commerciale vero arriva dal servizio dello scontrino digitale.</p>
  <pre>{{testo}}</pre>
  <footer>Monitor cliente · powered by Bluetech</footer>
</main>
</body>
</html>
