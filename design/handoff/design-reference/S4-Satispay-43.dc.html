<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pagamento Satispay — 4:3 Trattoria</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;1,400&amp;family=Alegreya+Sans:wght@400;500;700&amp;display=swap">
<style>
body { margin: 0; background: #F6EEE2; }
a { color: #9C3A1F; }
a:hover { color: #6B2A14; }
@keyframes bt-halo { 0% { transform: scale(0.94); opacity: 0.5; } 100% { transform: scale(1.14); opacity: 0; } }
.bt-halo { animation: bt-halo 3.2s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.bt-halo2 { animation: bt-halo 3.2s cubic-bezier(0.16, 1, 0.3, 1) 1.6s infinite; }
@media (prefers-reduced-motion: reduce) { .bt-halo, .bt-halo2 { animation: none; } }
</style>
</helmet>

<div style="--c-primary: #9C3A1F; --c-accent: #1E6B4F; --c-bg: #F6EEE2; --c-surface: #FFFBF4; --c-text: #2B211A; --c-muted: #6B5B49; width: 1024px; height: 768px; box-sizing: border-box; position: relative; overflow: hidden; background: #F6EEE2; color: #2B211A; font-family: 'Alegreya Sans', 'Segoe UI', sans-serif">

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 50% 44%, rgba(201,138,94,0.26) 0%, rgba(201,138,94,0) 62%), linear-gradient(170deg, #F8F1E6 0%, #EFE3D2 100%)"></div>

  <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; padding: 26px 40px; display: flex; flex-direction: column; gap: 12px">

    <!-- 4:3 e verticale: niente colonna laterale, quindi il QR va a tutto schermo -->
    <div style="height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="display: flex; align-items: center; gap: 10px">
        <svg width="28" height="28" viewBox="0 0 58 58" role="img" aria-label="Logo del locale (segnaposto)">
          <circle cx="29" cy="29" r="27.5" fill="none" stroke="rgba(43,33,26,0.3)" stroke-width="2"></circle>
          <path d="M20 40 Q29 14 38 40" fill="none" stroke="#9C3A1F" stroke-width="3.2" stroke-linecap="round"></path>
          <line x1="20" y1="40" x2="38" y2="40" stroke="#2B211A" stroke-width="2.8"></line>
        </svg>
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 20px; font-weight: 600">Trattoria del Borgo</div>
      </div>
      <div style="font-size: 15px; color: #6B5B49">Tavolo 4</div>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px">

      <div style="display: flex; align-items: baseline; gap: 16px">
        <div style="font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; color: #6B5B49">Da pagare</div>
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 86px; font-weight: 600; line-height: 0.9; letter-spacing: -0.02em; font-variant-numeric: tabular-nums">€ 18,90</div>
      </div>

      <div style="position: relative; width: 420px; height: 420px; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
        <div class="bt-halo" style="position: absolute; width: 396px; height: 396px; border-radius: 24px; border: 2px solid rgba(156,58,31,0.6)"></div>
        <div class="bt-halo2" style="position: absolute; width: 396px; height: 396px; border-radius: 24px; border: 2px solid rgba(30,107,79,0.45)"></div>
        <div style="position: relative; width: 380px; height: 380px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; padding: 48px; border: 1px solid rgba(43,33,26,0.1); display: flex; align-items: center; justify-content: center">
          <div role="img" aria-label="Codice QR per il pagamento Satispay" style="display: grid; grid-template-rows: repeat(25, 1fr); width: 284px; height: 284px; color: #000000">
            <sc-for list="{{qr}}" as="row" hint-placeholder-count="25">
              <div style="display: grid; grid-template-columns: repeat(25, 1fr)">
                <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="25">
                  <div style="background: {{c.fill}}"></div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
      </div>

      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
        <div style="font-size: 28px; font-weight: 700; text-align: center">Inquadra il QR con l'app Satispay</div>
        <div style="border: 1px dashed rgba(43,33,26,0.3); border-radius: 10px; padding: 10px 18px; display: flex; align-items: center; gap: 10px">
          <div style="font-family: 'Newsreader', Georgia, serif; font-size: 14px; font-weight: 600; letter-spacing: 0.16em">LOGO SATISPAY</div>
          <div style="font-size: 12px; color: #6B5B49">asset ufficiale</div>
        </div>
      </div>
    </div>

    <div style="height: 36px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 16px">
      <div style="font-size: 14px; color: #6B5B49">Nessuna conferma a schermo: il pagamento si chiude sul telefono.</div>
      <div style="display: flex; align-items: center; gap: 10px">
        <div style="font-size: 13px; color: #6B5B49">powered by</div>
        <svg width="20" height="20" viewBox="0 0 34 34" role="img" aria-label="Marchio Bluetech (segnaposto)">
          <rect x="1" y="1" width="32" height="32" rx="9" fill="none" stroke="#1F6FEB" stroke-width="2.6"></rect>
          <path d="M11 24V10h6.5a4 4 0 0 1 0 8H11m0 0h7.5a4 4 0 0 1 0 6H11" fill="none" stroke="#2B211A" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <div style="font-family: 'Newsreader', Georgia, serif; font-size: 15px; font-weight: 600; letter-spacing: 0.16em; color: #2B211A">BLUETECH</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1024,"height":768}}'>
class Component extends DCLogic {
  qrRows(n, seed) {
    var m = [], i, j, y, x;
    for (i = 0; i < n; i++) { m.push(new Array(n).fill(0)); }
    for (var f = 0; f < 3; f++) {
      var r0 = f === 2 ? n - 7 : 0;
      var c0 = f === 1 ? n - 7 : 0;
      for (y = 0; y < 7; y++) {
        for (x = 0; x < 7; x++) {
          var on = (y === 0 || y === 6 || x === 0 || x === 6) || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
          m[r0 + y][c0 + x] = on ? 1 : 0;
        }
      }
    }
    for (i = 8; i < n - 8; i++) { m[6][i] = i % 2 === 0 ? 1 : 0; m[i][6] = i % 2 === 0 ? 1 : 0; }
    for (y = 0; y < 5; y++) {
      for (x = 0; x < 5; x++) {
        var on2 = (y === 0 || y === 4 || x === 0 || x === 4) || (y === 2 && x === 2);
        m[n - 9 + y][n - 9 + x] = on2 ? 1 : 0;
      }
    }
    var s = seed;
    function rnd() { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }
    function blocked(r, c) {
      if (r < 9 && c < 9) { return true; }
      if (r < 9 && c >= n - 8) { return true; }
      if (r >= n - 8 && c < 9) { return true; }
      if (r === 6 || c === 6) { return true; }
      if (r >= n - 10 && r <= n - 4 && c >= n - 10 && c <= n - 4) { return true; }
      return false;
    }
    for (i = 0; i < n; i++) {
      for (j = 0; j < n; j++) { if (!blocked(i, j)) { m[i][j] = rnd() > 0.52 ? 1 : 0; } }
    }
    return m.map(function (row) {
      return { cells: row.map(function (v) { return { fill: v ? 'currentColor' : 'transparent' }; }) };
    });
  }
  renderVals() {
    return { qr: this.qrRows(25, 18901019) };
  }
}
</script>
</body>
</html>
