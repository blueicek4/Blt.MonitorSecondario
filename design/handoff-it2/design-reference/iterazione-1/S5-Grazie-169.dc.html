<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Grazie — 16:9</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap">
<style>
body { margin: 0; background: #0B1017; }
a { color: #8FA3C0; }
a:hover { color: #E6EAF2; }
@keyframes bt-ring { 0% { transform: scale(0.6); opacity: 0.85; } 100% { transform: scale(1.9); opacity: 0; } }
@keyframes bt-rise { 0% { opacity: 0; transform: translateY(24px); } 100% { opacity: 1; transform: none; } }
.bt-ring { animation: bt-ring 1.8s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
.bt-ring2 { animation: bt-ring 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.14s infinite; }
.bt-ring3 { animation: bt-ring 1.8s cubic-bezier(0.16, 1, 0.3, 1) 0.28s infinite; }
.bt-rise { animation: bt-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) both; }
.bt-rise-2 { animation: bt-rise 520ms cubic-bezier(0.16, 1, 0.3, 1) 120ms both; }
@media (prefers-reduced-motion: reduce) { .bt-ring, .bt-ring2, .bt-ring3, .bt-rise, .bt-rise-2 { animation: none; } }
</style>
</helmet>

<div style="--c-primary: #1F6FEB; --c-accent: #3DDC97; --c-bg: #0B1017; --c-text: #E6EAF2; --c-muted: #9AA6BA; width: 1920px; height: 1080px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B1017; color: #E6EAF2; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif">

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 60% 55% at 36% 46%, rgba(31,111,235,0.3) 0%, rgba(31,111,235,0) 64%), radial-gradient(ellipse 40% 40% at 78% 70%, rgba(61,220,151,0.16) 0%, rgba(61,220,151,0) 62%), linear-gradient(170deg, #0E1726 0%, #0B1017 60%, #05070A 100%)"></div>

  <!-- celebrazione: tre anelli nei colori del locale -->
  <div style="position: absolute; left: 36%; top: 50%; transform: translate(-50%, -50%); width: 520px; height: 520px; display: flex; align-items: center; justify-content: center">
    <div class="bt-ring" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 2px solid rgba(31,111,235,0.8)"></div>
    <div class="bt-ring2" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 2px solid rgba(61,220,151,0.55)"></div>
    <div class="bt-ring3" style="position: absolute; width: 420px; height: 420px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.2)"></div>
  </div>

  <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; padding: 56px 64px; display: flex; flex-direction: column; gap: 24px">

    <div style="height: 60px; display: flex; align-items: center; gap: 16px; flex-shrink: 0">
      <svg width="42" height="42" viewBox="0 0 58 58" role="img" aria-label="Logo del locale (segnaposto)">
        <circle cx="29" cy="29" r="27.5" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="1.6"></circle>
        <path d="M17 38 L29 16 L41 38 Z" fill="none" stroke="#E6EAF2" stroke-width="2.6" stroke-linejoin="round"></path>
        <line x1="17" y1="38" x2="41" y2="38" stroke="#3DDC97" stroke-width="2.6"></line>
      </svg>
      <div style="font-family: 'Archivo', sans-serif; font-size: 26px; font-weight: 700; letter-spacing: 0.06em">LA VELA</div>
    </div>

    <div style="flex-grow: 1; min-height: 0; display: flex; align-items: center; gap: 110px">

      <div class="bt-rise" style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 26px">
        <div style="font-family: 'Archivo', sans-serif; font-size: 124px; font-weight: 700; line-height: 0.98; letter-spacing: -0.035em">Grazie<br>e arrivederci</div>
        <div style="display: flex; align-items: baseline; gap: 20px">
          <div style="font-family: 'Archivo', sans-serif; font-size: 19px; font-weight: 600; letter-spacing: 0.22em; text-transform: uppercase; color: #9AA6BA">Pagato</div>
          <div style="font-family: 'Archivo', sans-serif; font-size: 58px; font-weight: 700; font-variant-numeric: tabular-nums">€ 18,90</div>
        </div>
      </div>

      <!-- QR opzionale: recensione, fidelity o menu digitale -->
      <div class="bt-rise-2" style="width: 480px; flex-shrink: 0; display: flex; flex-direction: column; gap: 22px; align-items: center">
        <div style="width: 340px; height: 340px; box-sizing: border-box; border-radius: 22px; background: #FFFFFF; padding: 44px; display: flex; align-items: center; justify-content: center">
          <div role="img" aria-label="Codice QR per lasciare una recensione" style="display: grid; grid-template-rows: repeat(25, 1fr); width: 252px; height: 252px; color: #000000">
            <sc-for list="{{qr}}" as="row" hint-placeholder-count="25">
              <div style="display: grid; grid-template-columns: repeat(25, 1fr)">
                <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="25">
                  <div style="background: {{c.fill}}"></div>
                </sc-for>
              </div>
            </sc-for>
          </div>
        </div>
        <div style="text-align: center; display: flex; flex-direction: column; gap: 8px">
          <div style="font-size: 30px; font-weight: 600">Com'è andata?</div>
          <div style="font-size: 20px; color: #9AA6BA; line-height: 1.45">Lascia una recensione · il locale scegli se questo QR punta a Google, alla fidelity o al menu</div>
        </div>
      </div>
    </div>

    <div style="height: 56px; flex-shrink: 0; display: flex; align-items: center; justify-content: space-between; gap: 24px">
      <div style="font-size: 18px; color: #6F7E95">Dopo 8 secondi lo schermo torna da solo in attesa.</div>
      <div style="display: flex; align-items: center; gap: 12px">
        <div style="font-size: 15px; color: #8FA3C0">powered by</div>
        <svg width="24" height="24" viewBox="0 0 34 34" role="img" aria-label="Marchio Bluetech (segnaposto)">
          <rect x="1" y="1" width="32" height="32" rx="9" fill="none" stroke="#1F6FEB" stroke-width="2.6"></rect>
          <path d="M11 24V10h6.5a4 4 0 0 1 0 8H11m0 0h7.5a4 4 0 0 1 0 6H11" fill="none" stroke="#E6EAF2" stroke-width="3" stroke-linecap="round"></path>
        </svg>
        <div style="font-family: 'Archivo', sans-serif; font-size: 17px; font-weight: 600; letter-spacing: 0.16em; color: #E6EAF2">BLUETECH</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1920,"height":1080}}'>
class Component extends DCLogic {
  qrRows(n, seed) {
    var m = [], i, j, y, x;
    for (i = 0; i < n; i++) { m.push(new Array(n).fill(0)); }
    for (var f = 0; f < 3; f++) {
      var r0 = f === 2 ? n - 7 : 0;
      var c0 = f === 1 ? n - 7 : 0;
      for (y = 0; y < 7; y++) {
        for (x = 0; x < 7; x++) {
          var on = (y === 0 || y === 6 || x === 0 || x === 6) || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
          m[r0 + y][c0 + x] = on ? 1 : 0;
        }
      }
    }
    for (i = 8; i < n - 8; i++) { m[6][i] = i % 2 === 0 ? 1 : 0; m[i][6] = i % 2 === 0 ? 1 : 0; }
    for (y = 0; y < 5; y++) {
      for (x = 0; x < 5; x++) {
        var on2 = (y === 0 || y === 4 || x === 0 || x === 4) || (y === 2 && x === 2);
        m[n - 9 + y][n - 9 + x] = on2 ? 1 : 0;
      }
    }
    var s = seed;
    function rnd() { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }
    function blocked(r, c) {
      if (r < 9 && c < 9) { return true; }
      if (r < 9 && c >= n - 8) { return true; }
      if (r >= n - 8 && c < 9) { return true; }
      if (r === 6 || c === 6) { return true; }
      if (r >= n - 10 && r <= n - 4 && c >= n - 10 && c <= n - 4) { return true; }
      return false;
    }
    for (i = 0; i < n; i++) {
      for (j = 0; j < n; j++) { if (!blocked(i, j)) { m[i][j] = rnd() > 0.5 ? 1 : 0; } }
    }
    return m.map(function (row) {
      return { cells: row.map(function (v) { return { fill: v ? 'currentColor' : 'transparent' }; }) };
    });
  }
  renderVals() {
    return { qr: this.qrRows(25, 77310410) };
  }
}
</script>
</body>
</html>
