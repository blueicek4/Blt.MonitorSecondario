<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Scontrino digitale — palmare</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Mono:wght@400;500;600&amp;display=swap">
<style>
body { margin: 0; background: #0B1017; }
a { color: #8FA3C0; }
a:hover { color: #E6EAF2; }
</style>
</helmet>

<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #0B1017; color: #E6EAF2; font-family: 'IBM Plex Sans', 'Segoe UI', sans-serif">

  <div style="position: absolute; inset: 0; background: radial-gradient(ellipse 70% 40% at 50% 18%, rgba(31,111,235,0.2) 0%, transparent 62%), linear-gradient(180deg, #121A26 0%, #0B1017 60%, #070B11 100%)"></div>

  <div style="position: relative; width: 100%; height: 100%; box-sizing: border-box; padding: 20px 20px 0; display: flex; flex-direction: column; gap: 14px">

    <div style="flex-shrink: 0; text-align: center; display: flex; flex-direction: column; gap: 3px">
      <div style="font-family: 'Archivo', sans-serif; font-size: 22px; font-weight: 700">Il tuo scontrino</div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.62)">Inquadra e scaricalo</div>
    </div>

    <div style="flex-shrink: 0; align-self: center; width: 246px; height: 246px; box-sizing: border-box; border-radius: 18px; background: #FFFFFF; padding: 28px; display: flex; align-items: center; justify-content: center">
      <div role="img" aria-label="Codice QR per scaricare lo scontrino digitale" style="display: grid; grid-template-rows: repeat(25, 1fr); width: 190px; height: 190px; color: #000000">
        <sc-for list="{{qr}}" as="row" hint-placeholder-count="25">
          <div style="display: grid; grid-template-columns: repeat(25, 1fr)">
            <sc-for list="{{row.cells}}" as="c" hint-placeholder-count="25">
              <div style="background: {{c.fill}}"></div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </div>

    <!-- DEROGA DICHIARATA: qui il pulsante è vero, perché lo schermo è touch e in mano al cameriere -->
    <button type="button" style="flex-shrink: 0; min-height: 56px; border: none; border-radius: 14px; background: #1F6FEB; color: #FFFFFF; font-family: 'IBM Plex Sans', sans-serif; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <rect x="5" y="3" width="14" height="6" rx="1" stroke="#FFFFFF" stroke-width="1.8"></rect>
        <rect x="3" y="9" width="18" height="7" rx="2" stroke="#FFFFFF" stroke-width="1.8"></rect>
        <rect x="6" y="15" width="12" height="6" rx="1" stroke="#FFFFFF" stroke-width="1.8"></rect>
      </svg>
      Voglio la copia di carta
    </button>

    <!-- lo scontrino: scorre, e si vede che scorre -->
    <div style="flex-grow: 1; min-height: 0; position: relative">
      <div style="position: absolute; inset: 0; border-radius: 12px 12px 0 0; background: #F8F6F1; color: #15110C; padding: 18px 18px 0; box-sizing: border-box; font-family: 'IBM Plex Mono', monospace; display: flex; flex-direction: column; gap: 9px; overflow: hidden">
        <div style="text-align: center; display: flex; flex-direction: column; gap: 1px; font-size: 12px; line-height: 1.35">
          <div style="font-weight: 600">LA VELA</div>
          <div>VIA DELLE PROVE NUM 20 · ROMA</div>
          <div>P.I.00000000000</div>
        </div>
        <div style="border-top: 1px dashed rgba(21,17,12,0.3)"></div>
        <div style="display: flex; flex-direction: column; gap: 5px; font-size: 13px">
          <div style="display: flex; justify-content: space-between"><span>Tomino con Verdure</span><span style="font-variant-numeric: tabular-nums">12,00</span></div>
          <div style="display: flex; justify-content: space-between"><span>I 4 salumi</span><span style="font-variant-numeric: tabular-nums">12,00</span></div>
          <div style="display: flex; justify-content: space-between"><span>Tagliere Emilia x 2</span><span style="font-variant-numeric: tabular-nums">30,00</span></div>
          <div style="display: flex; justify-content: space-between"><span>Cestino di tigelle x 2</span><span style="font-variant-numeric: tabular-nums">6,00</span></div>
          <div style="display: flex; justify-content: space-between"><span>Vecchia Malga x 2</span><span style="font-variant-numeric: tabular-nums">27,00</span></div>
        </div>
        <div style="border-top: 1px dashed rgba(21,17,12,0.3)"></div>
        <div style="display: flex; justify-content: space-between; align-items: baseline; font-size: 21px; font-weight: 600"><span>TOTALE</span><span style="font-variant-numeric: tabular-nums">87,00</span></div>
        <div style="display: flex; justify-content: space-between; font-size: 13px"><span>Pagato CONTANTI</span><span style="font-variant-numeric: tabular-nums">87,00</span></div>
      </div>
      <!-- il bordo sfumato dice che sotto c'è altro -->
      <div style="position: absolute; left: 0; right: 0; bottom: 0; height: 54px; background: linear-gradient(180deg, rgba(248,246,241,0) 0%, rgba(248,246,241,0.98) 72%); display: flex; align-items: flex-end; justify-content: center; padding-bottom: 8px">
        <div style="font-size: 11px; letter-spacing: 0.1em; color: rgba(21,17,12,0.5)">scorri per il resto</div>
      </div>
    </div>
  </div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  qrRows(n, seed) {
    var m = [], i, j, y, x;
    for (i = 0; i < n; i++) { m.push(new Array(n).fill(0)); }
    for (var f = 0; f < 3; f++) {
      var r0 = f === 2 ? n - 7 : 0;
      var c0 = f === 1 ? n - 7 : 0;
      for (y = 0; y < 7; y++) {
        for (x = 0; x < 7; x++) {
          var on = (y === 0 || y === 6 || x === 0 || x === 6) || (y >= 2 && y <= 4 && x >= 2 && x <= 4);
          m[r0 + y][c0 + x] = on ? 1 : 0;
        }
      }
    }
    for (i = 8; i < n - 8; i++) { m[6][i] = i % 2 === 0 ? 1 : 0; m[i][6] = i % 2 === 0 ? 1 : 0; }
    for (y = 0; y < 5; y++) {
      for (x = 0; x < 5; x++) {
        var on2 = (y === 0 || y === 4 || x === 0 || x === 4) || (y === 2 && x === 2);
        m[n - 9 + y][n - 9 + x] = on2 ? 1 : 0;
      }
    }
    var s = seed;
    function rnd() { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648; }
    function blocked(r, c) {
      if (r < 9 && c < 9) { return true; }
      if (r < 9 && c >= n - 8) { return true; }
      if (r >= n - 8 && c < 9) { return true; }
      if (r === 6 || c === 6) { return true; }
      if (r >= n - 10 && r <= n - 4 && c >= n - 10 && c <= n - 4) { return true; }
      return false;
    }
    for (i = 0; i < n; i++) {
      for (j = 0; j < n; j++) { if (!blocked(i, j)) { m[i][j] = rnd() > 0.5 ? 1 : 0; } }
    }
    return m.map(function (row) {
      return { cells: row.map(function (v) { return { fill: v ? 'currentColor' : 'transparent' }; }) };
    });
  }
  renderVals() {
    return { qr: this.qrRows(25, 21102612) };
  }
}
</script>
</body>
</html>
