name: Build

on:
  push:
    paths:
      - "player/**"
      - "tools/**"
      - "agent/**"
      - "samples/**"
      - "android/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test registratore (.NET 10 e .NET Framework)
        run: dotnet test tools/Bluetech.Display.Recorder.Tests/Bluetech.Display.Recorder.Tests.csproj -c Release

      - name: Build registratore
        run: dotnet build tools/Bluetech.Display.Recorder/Bluetech.Display.Recorder.csproj -c Release -f net462

      - name: Build player
        run: dotnet build player/Bluetech.Display.Player/Bluetech.Display.Player.csproj -c Release

      - name: Test Agent
        run: dotnet test agent/Bluetech.Display.Agent.Tests/Bluetech.Display.Agent.Tests.csproj -c Release

      # Un solo exe, con dentro .NET: in cassa non si installa niente.
      - name: Pubblica Agent
        run: dotnet publish agent/Bluetech.Display.Agent/Bluetech.Display.Agent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/agent

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechRecorder
          path: |
            tools/Bluetech.Display.Recorder/bin/Release/net462/BluetechRecorder.exe
            tools/Bluetech.Display.Recorder/bin/Release/net462/BluetechRecorder.exe.config
            tools/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechDisplayPlayer
          path: |
            player/Bluetech.Display.Player/bin/Release/net472/
            !player/Bluetech.Display.Player/bin/Release/net472/*.pdb
            !player/Bluetech.Display.Player/bin/Release/net472/Microsoft.Web.WebView2.Wpf.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechDisplayAgent
          path: |
            out/agent/BluetechDisplayAgent.exe
            out/agent/appsettings.json
            agent/README.md

  # L'app Android del monitor cliente per i tablet. Si compila qui: serve l'SDK Android.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Con il keystore nei segreti del repository l'APK è firmato sempre con la stessa chiave e gli aggiornamenti si
      # installano sopra; senza, è firmato con una chiave di prova (da disinstallare prima di aggiornare).
      - name: Keystore di firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/bluetech.keystore"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/bluetech.keystore" >> "$GITHUB_ENV"
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle -p android --no-daemon assembleRelease

      - name: Nome dell'APK
        run: cp android/app/build/outputs/apk/release/app-release.apk android/BluetechDisplay.apk

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechDisplayAndroid
          path: |
            android/BluetechDisplay.apk
            android/README.md
