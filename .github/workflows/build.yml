name: Build

on:
  push:
    paths:
      - "player/**"
      - "tools/**"
      - "agent/**"
      - "samples/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test registratore (.NET 10 e .NET Framework)
        run: dotnet test tools/Bluetech.Display.Recorder.Tests/Bluetech.Display.Recorder.Tests.csproj -c Release

      - name: Build registratore
        run: dotnet build tools/Bluetech.Display.Recorder/Bluetech.Display.Recorder.csproj -c Release -f net462

      - name: Build player
        run: dotnet build player/Bluetech.Display.Player/Bluetech.Display.Player.csproj -c Release

      - name: Test Agent
        run: dotnet test agent/Bluetech.Display.Agent.Tests/Bluetech.Display.Agent.Tests.csproj -c Release

      # Un solo exe, con dentro .NET: in cassa non si installa niente.
      - name: Pubblica Agent
        run: dotnet publish agent/Bluetech.Display.Agent/Bluetech.Display.Agent.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true -o out/agent

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechRecorder
          path: |
            tools/Bluetech.Display.Recorder/bin/Release/net462/BluetechRecorder.exe
            tools/Bluetech.Display.Recorder/bin/Release/net462/BluetechRecorder.exe.config
            tools/README.md

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechDisplayPlayer
          path: |
            player/Bluetech.Display.Player/bin/Release/net472/
            !player/Bluetech.Display.Player/bin/Release/net472/*.pdb
            !player/Bluetech.Display.Player/bin/Release/net472/Microsoft.Web.WebView2.Wpf.dll

      - uses: actions/upload-artifact@v4
        with:
          name: BluetechDisplayAgent
          path: |
            out/agent/BluetechDisplayAgent.exe
            out/agent/appsettings.json
            agent/README.md
